<svg xmlns="http://www.w3.org/2000/svg" width="768" height="64" viewBox="0 0 768 64" role="img" aria-label="Hi. I'm naturalclar. Full-time developer.">
	<style>
		.line {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
			font-size: 30px;
			fill: #05dfd7;
		}
		/* 41 characters revealed one step at a time, so the clip edge always lands on a
		   character boundary — textLength below pins each advance to 738/41px. */
		#reveal { animation: reveal 6s steps(41, end) infinite; }
		.caret {
			fill: #05dfd7;
			animation: caret 6s steps(41, end) infinite, blink 1s steps(2, start) infinite;
		}
		@keyframes reveal {
			0%   { transform: scaleX(0); }
			45%  { transform: scaleX(1); }
			65%  { transform: scaleX(1); }
			90%  { transform: scaleX(0); }
			100% { transform: scaleX(0); }
		}
		@keyframes caret {
			0%   { transform: translateX(0); }
			45%  { transform: translateX(738px); }
			65%  { transform: translateX(738px); }
			90%  { transform: translateX(0); }
			100% { transform: translateX(0); }
		}
		@keyframes blink {
			0%, 49%   { opacity: 1; }
			50%, 100% { opacity: 0; }
		}
		@media (prefers-reduced-motion: reduce) {
			#reveal, .caret { animation: none; }
			#reveal { transform: scaleX(1); }
			.caret { transform: translateX(738px); }
		}
	</style>
	<defs>
		<clipPath id="typed">
			<rect id="reveal" x="0" y="0" width="738" height="64" />
		</clipPath>
	</defs>
	<g transform="translate(15,0)">
		<text class="line" x="0" y="43" textLength="738" lengthAdjust="spacing" clip-path="url(#typed)">Hi. I'm naturalclar. Full-time developer.</text>
		<rect class="caret" x="0" y="17" width="15" height="34" />
	</g>
</svg>
